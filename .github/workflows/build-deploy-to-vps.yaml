name: Build and Deploy frontend to VPS

on:
  workflow_dispatch: 

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  build-docker-image:
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout repository.
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build Docker image using existing Dockerfile
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          version="${{ github.event.release.tag_name || github.run_number }}"
          echo "Building version: ${version}"
          docker build -f Dockerfile \
              -t ghcr.io/${owner}/safebite-frontend-h6:${version} \
              -t ghcr.io/${owner}/safebite-frontend-h6:latest .

      - name: Push Dev Container image to GitHub Container Registry
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          version="${{ github.event.release.tag_name || github.run_number }}"
          docker push ghcr.io/${owner}/safebite-frontend-h6:${version}
          docker push ghcr.io/${owner}/safebite-frontend-h6:latest

  deploy:
    needs: build-docker-image
    runs-on: ubuntu-latest
    environment: VPS

    steps:
      - name: SSH to VPS and deploy
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: chimpchonkserver.duckdns.org
          username: githubaction
          key: ${{ secrets.SSH_KEY }}
          script: |
            owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            version="${{ github.event.release.tag_name || github.run_number }}"

            # define a container name so docker run receives a valid --name argument
            container_name="safebite-frontend"

            echo "Logging in to Docker registry..."
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GHCR_PAT }}

            echo "Pulling version ${version}..."
            docker pull ghcr.io/${owner}/safebite-frontend:${version}

            echo "Stopping existing container (if any)..."
            docker ps -a --filter "name=${container_name}" --format "{{.ID}}" | xargs -r docker rm -f

            echo "Running new frontend docker image"
            docker run -d -p 9600:8080 --restart unless-stopped \
            --name "${container_name}" ghcr.io/${owner}/safebite-frontend:${version}

            echo "Deployed"
